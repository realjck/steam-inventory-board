<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Steam Inventory Board</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <button id="open-settings" class="icon-button" type="button" title="Settings" aria-label="Settings"></button>
        <h1><span id="owner-name">My Steam inventory</span> <small id="owner-url" class="owner-url" hidden></small></h1>
      </div>
      <div class="sync">
        <p id="fetched-at" class="sync-date"></p>
        <button id="refresh-inventory" class="icon-button" type="button" title="Refresh inventory" aria-label="Refresh inventory"></button>
      </div>
      <p id="sync-error" class="sync-error" role="alert" hidden></p>
    </header>

    <form id="filters" class="filters" role="search">
      <label class="search">
        <span class="visually-hidden">Search an item or a game</span>
        <input id="search" type="search" placeholder="Item or game…" autocomplete="off" />
      </label>
      <label class="select">
        <span class="visually-hidden">Type</span>
        <select id="type"><option value="">All types</option></select>
      </label>
      <label class="select">
        <span class="visually-hidden">Rarity</span>
        <select id="rarity"><option value="">All rarities</option></select>
      </label>
      <label class="toggle"><input id="foil-only" type="checkbox" /> Foil</label>
      <label class="toggle"><input id="duplicates-only" type="checkbox" /> Duplicates</label>
      <label class="toggle"><input id="tradable-only" type="checkbox" /> Tradable</label>
      <label class="toggle"><input id="marketable-only" type="checkbox" /> Marketable</label>
      <button id="clear-filters" class="text-button" type="reset">Clear filters</button>
    </form>

    <main class="table-wrap">
      <table>
        <thead>
          <tr>
            <th scope="col" class="col-collection"><span class="visually-hidden">Collection</span></th>
            <th scope="col" class="col-icon"><span class="visually-hidden">Image</span></th>
            <th scope="col" data-sort="name" class="col-name">Name</th>
            <th scope="col" data-sort="game" class="col-game">Game</th>
            <th scope="col" data-sort="type">Type</th>
            <th scope="col" data-sort="rarity">Rarity</th>
            <th scope="col" data-sort="foil">Foil</th>
            <th scope="col" data-sort="quantity" class="num">Quantity</th>
            <th scope="col" data-sort="sell" class="num" title="Lowest sell listing">Sell</th>
            <th scope="col" data-sort="buy" class="num" title="Highest buy order">Buy</th>
            <th scope="col" class="col-prices">Prices</th>
            <th scope="col" data-sort="tradable" class="flag">Tradable</th>
            <th scope="col" data-sort="marketable" class="flag">Marketable</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
        <tfoot>
          <tr>
            <td id="totals"></td>
          </tr>
        </tfoot>
      </table>
      <div id="empty" class="empty" hidden></div>
    </main>

    <section id="settings" class="settings" aria-labelledby="settings-title" hidden>
      <form id="settings-form" class="settings-form" novalidate>
        <h2 id="settings-title">Settings</h2>
        <label for="steam-id">SteamID64</label>
        <input id="steam-id" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="7656119…" aria-describedby="steam-id-help steam-id-error" />
        <p id="steam-id-help" class="settings-help">Find it on your Steam profile page or with a SteamID lookup site. The inventory must be public.</p>
        <p id="steam-id-error" class="settings-error" role="alert" hidden></p>
        <div class="settings-actions">
          <button id="save-settings" class="labelled-button" type="submit">Save</button>
          <button id="cancel-settings" class="text-button" type="button">Cancel</button>
        </div>
      </form>
    </section>
  </body>
</html>
