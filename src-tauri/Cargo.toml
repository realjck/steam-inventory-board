[package]
name = "steam-inventory-board"
version = "1.0.1"
description = "Local, read-only board of a public Steam community inventory"
authors = ["jck"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "steam_inventory_board_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-opener = "2"
# Default features minus "cookies" (the app must not keep Steam cookies), plus "unsafe-headers"
# so requests can drop the Origin header: the market order book answers 401 to a foreign Origin.
tauri-plugin-http = { version = "2", default-features = false, features = ["rustls-tls", "http2", "charset", "system-proxy", "unsafe-headers"] }
